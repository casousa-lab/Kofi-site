<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kofi</title>
  <link rel="shortcut icon" href="/assets/icons/favicon-kofi.svg" type="image/svg">
  <link rel="stylesheet" href="/css/style.css">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
</head>

<body>
  
 <div id="header-placeholder"></div>
  <main>
    <section id="hero">
      <video autoplay loop muted playsinline class="bg-video">
        <source src="/assets/videos/Kofi-Hero-Compactado - Trim.mp4" type="video/mp4">
      </video>
      <div class="overlay"></div>
      <div class="hero-content">
        <h1>Sabor em <br> cada detalhe</h1>
        <p>Do pequeno produtor direto para a <br> sua xícara. O café especial feito <br> com propósito.</p>
        <a href="menu.html" class="btn-outline">
          <span>Fazer pedido</span>
          <i class="ph ph-shopping-bag"></i>
        </a>
      </div>
      <div class="scroll-indicator">
        <i class="ph ph-caret-double-down"></i>
      </div>
    </section>
    <section id="manifesto" class="container">
      <span class="tagline">A essência</span>
      <h2>Onde a música encontra o sabor do café</h2>
    </section>
    
  </main>
  <div id="footer-placeholder"></div>
   <script src="/js/script.js"></script>
</body>

</html>
